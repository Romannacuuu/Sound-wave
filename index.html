<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoundWave - Catálogo de Canciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        .card-header {
            background: linear-gradient(90deg, #1DB954 0%, #191414 100%);
            color: white;
            border-radius: 15px 15px 0 0 !important;
        }
        .btn-soundwave {
            background-color: #1DB954;
            color: white;
            font-weight: bold;
            padding: 12px 30px;
            border-radius: 50px;
        }
        .btn-soundwave:hover {
            background-color: #1ed760;
            color: white;
        }
        table {
            background-color: white;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="card">
            <div class="card-header">
                <h2 class="text-center mb-0">
                    <i class="fas fa-music me-2"></i>
                    SoundWave - Tu Catálogo Musical
                </h2>
            </div>
            <div class="card-body text-center">
                <button id="btnCargar" class="btn btn-soundwave btn-lg mb-4">
                    <i class="fas fa-play-circle me-2"></i>
                    Ver Canciones
                </button>
                
                <div id="cargando" style="display: none;">
                    <div class="spinner-border text-success" role="status">
                        <span class="visually-hidden">Cargando...</span>
                    </div>
                    <p>Cargando canciones...</p>
                </div>

                <div id="tablaContainer" style="display: none;">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover">
                            <thead class="table-dark">
                                <tr>
                                    <th>Título</th>
                                    <th>Duración</th>
                                    <th>Artista</th>
                                    <th>Género</th>
                                </tr>
                            </thead>
                            <tbody id="cancionesBody">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api/canciones';
        
        const btnCargar = document.getElementById('btnCargar');
        const tablaContainer = document.getElementById('tablaContainer');
        const cargando = document.getElementById('cargando');
        const cancionesBody = document.getElementById('cancionesBody');

        async function cargarCanciones() {
            tablaContainer.style.display = 'none';
            cargando.style.display = 'block';
            cancionesBody.innerHTML = '';

            try {
                const response = await fetch(API_URL);
                
                if (!response.ok) {
                    throw new Error(`Error HTTP: ${response.status}`);
                }
                
                const canciones = await response.json();
                console.log('Canciones recibidas:', canciones); // Para depurar
                
                cargando.style.display = 'none';
                
                if (canciones.length === 0) {
                    cancionesBody.innerHTML = '<tr><td colspan="4" class="text-center">No hay canciones</td></tr>';
                } else {
                    canciones.forEach(cancion => {
                        const fila = document.createElement('tr');
                        fila.innerHTML = `
                            <td><i class="fas fa-music text-success me-2"></i><strong>${cancion.cancion_titulo}</strong></td>
                            <td><span class="badge bg-secondary">${cancion.duracion.substring(0, 5)}</span></td>
                            <td><i class="fas fa-microphone-alt text-primary me-2"></i>${cancion.artista_nombre}</td>
                            <td><span class="badge bg-info">${cancion.genero_nombre}</span></td>
                        `;
                        cancionesBody.appendChild(fila);
                    });
                }
                
                tablaContainer.style.display = 'block';
                
            } catch (error) {
                console.error('Error:', error);
                cargando.style.display = 'none';
                cancionesBody.innerHTML = `<tr><td colspan="4" class="text-center text-danger">Error: ${error.message}</td></tr>`;
                tablaContainer.style.display = 'block';
            }
        }

        btnCargar.addEventListener('click', cargarCanciones);
    </script>
</body>
</html>
